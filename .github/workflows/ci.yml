name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.typst }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typst: ["0.15.0", "0.15.1"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ matrix.typst }}

      # The bytecode check asserts a byte-identical pele.kbc1, so pin the compiler that
      # produces it instead of following `stable`.
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - name: Build bundle and bytecode
        run: ./scripts/build.sh

      - name: Verify committed bytecode
        run: git diff --exit-code -- pele.kbc1

      - name: Smoke test
        run: bun tests/smoke.mjs

      - name: Theme and contrast checks
        run: ./tests/theme.sh

      - name: Check release metadata
        run: ./scripts/check-release.sh

      - name: Build diagram gallery PDFs
        run: ./scripts/build-diagrams.sh artifacts

      - name: Compile font matrix
        run: typst compile --root . tests/fonts.typ artifacts/fonts.pdf

      - name: Compile each corpus diagram in isolation
        run: ./tests/compile-corpus.sh

      - name: Stage package payload
        run: ./scripts/stage-package.sh

      - name: Compile examples against staged payload
        run: |
          for file in examples/*.typ sample.typ; do
            typst compile --root . --package-path dist/packages "$file" "/tmp/$(basename "${file%.typ}").pdf"
          done

      - name: Package checker
        if: matrix.typst == '0.15.1'
        env:
          PACKAGE_CHECK_ONLINE: "1"
        run: ./scripts/package-check.sh
