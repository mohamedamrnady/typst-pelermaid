name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already set in typst.toml (for example 0.1.0)"
        required: true
        type: string
      publish_packages:
        description: "Open or update the typst/packages PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release payload
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      package_dir: ${{ steps.stage.outputs.package_dir }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          name="$(awk -F'"' '/^name[[:space:]]*=/ { print $2; exit }' typst.toml)"
          version="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' typst.toml)"
          [ -n "$name" ] || { echo "package name missing" >&2; exit 1; }
          [ -n "$version" ] || { echo "package version missing" >&2; exit 1; }
          if [ -n "${REQUESTED_VERSION:-}" ] && [ "$REQUESTED_VERSION" != "$version" ]; then
            echo "requested version $REQUESTED_VERSION does not match typst.toml $version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match typst.toml version $version" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bundle and bytecode
        run: ./scripts/build.sh

      - name: Verify committed bytecode
        run: git diff --exit-code -- pele.kbc1

      - name: Smoke test
        run: bun tests/smoke.mjs

      - name: Check release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/check-release.sh

      - name: Build diagram gallery PDFs
        run: ./scripts/build-diagrams.sh artifacts

      - name: Stage package payload
        run: ./scripts/stage-package.sh

      - name: Compile examples against staged payload
        run: |
          for file in examples/*.typ sample.typ; do
            typst compile --root . --package-path dist/packages "$file" "/tmp/$(basename "${file%.typ}").pdf"
          done

      - name: Record staged path
        id: stage
        run: echo "package_dir=dist/packages/preview/${{ steps.version.outputs.name }}/${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Package checker
        env:
          PACKAGE_CHECK_ONLINE: "1"
        run: ./scripts/package-check.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelermaid-package
          path: dist/packages
          if-no-files-found: error

      - name: Upload diagram gallery
        uses: actions/upload-artifact@v4
        with:
          name: pelermaid-diagrams
          path: artifacts/*.pdf
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: pelermaid-package
          path: dist/packages

      - uses: actions/download-artifact@v4
        with:
          name: pelermaid-diagrams
          path: artifacts

      - name: Archive package
        run: |
          mkdir -p dist/release
          tar -C "${{ needs.build.outputs.package_dir }}" -czf \
            "dist/release/${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}.tar.gz" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/release/${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}.tar.gz" \
            artifacts/corpus.pdf \
            artifacts/prerendered.pdf \
            artifacts/compare.pdf \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish-packages:
    name: Open typst/packages PR
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_packages) || (github.event_name == 'push' && vars.PUBLISH_PACKAGES_PR == 'true') }}
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: pelermaid-package
          path: dist/packages

      - name: Open or update package PR
        env:
          TYPST_PACKAGES_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
          PACKAGES_FORK_OWNER: ${{ github.repository_owner }}
          PACKAGES_UPSTREAM: typst/packages
        run: ./scripts/open-packages-pr.sh "dist/packages/preview/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}"
