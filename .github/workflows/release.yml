name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version already set in typst.toml (for example 0.1.0)"
        required: true
        type: string
      push_packages:
        description: "Push the staged package to your typst/packages fork"
        required: false
        default: false
        type: boolean

# The token used by `build` cannot write repository contents. Only the release job can.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release payload
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      package_dir: ${{ steps.stage.outputs.package_dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: "0.15.1"

      # The bytecode check asserts a byte-identical pele.kbc1, so pin the compiler that
      # produces it instead of following `stable`.
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          name="$(awk -F'"' '/^name[[:space:]]*=/ { print $2; exit }' typst.toml)"
          version="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' typst.toml)"
          [ -n "$name" ] || { echo "package name missing" >&2; exit 1; }
          [ -n "$version" ] || { echo "package version missing" >&2; exit 1; }
          if [ -n "${REQUESTED_VERSION:-}" ] && [ "$REQUESTED_VERSION" != "$version" ]; then
            echo "requested version $REQUESTED_VERSION does not match typst.toml $version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match typst.toml version $version" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bundle and bytecode
        run: ./scripts/build.sh

      - name: Verify committed bytecode
        run: git diff --exit-code -- pele.kbc1

      - name: Smoke test
        run: bun tests/smoke.mjs

      - name: Theme and contrast checks
        run: ./tests/theme.sh

      - name: Check release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/check-release.sh

      - name: Build diagram gallery PDFs
        run: ./scripts/build-diagrams.sh artifacts

      - name: Stage package payload
        run: ./scripts/stage-package.sh

      - name: Compile examples against staged payload
        run: |
          for file in examples/*.typ sample.typ; do
            typst compile --root . --package-path dist/packages "$file" "/tmp/$(basename "${file%.typ}").pdf"
          done

      - name: Record staged path
        id: stage
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "package_dir=dist/packages/preview/$NAME/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package checker
        env:
          PACKAGE_CHECK_ONLINE: "1"
        run: ./scripts/package-check.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pelermaid-package
          path: dist/packages
          if-no-files-found: error

      - name: Upload diagram gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pelermaid-diagrams
          path: artifacts/*.pdf
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pelermaid-package
          path: dist/packages

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pelermaid-diagrams
          path: artifacts

      - name: Archive package
        env:
          PACKAGE_DIR: ${{ needs.build.outputs.package_dir }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p dist/release
          tar -C "$PACKAGE_DIR" -czf "dist/release/$NAME-$VERSION.tar.gz" .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="$VERSION" '/^## / { section = ($2 == version); next } section' \
            CHANGELOG.md > notes.md
          test -s notes.md || {
            echo "error: CHANGELOG.md has no '## $VERSION' section" >&2
            exit 1
          }

          archive="dist/release/$NAME-$VERSION.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Reruns replace assets and notes instead of failing on an existing release.
            gh release upload "$TAG" "$archive" artifacts/*.pdf --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$archive" artifacts/*.pdf \
              --title "$TAG" --notes-file notes.md
          fi

  push-packages:
    name: Push branch to typst/packages fork
    # Only after the GitHub release succeeds. Dispatch runs skip github-release, so a
    # skipped release job is allowed there; tag pushes require `success`.
    needs: [build, github-release]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') && ((github.event_name == 'workflow_dispatch' && inputs.push_packages) || (github.event_name == 'push' && vars.PUSH_PACKAGES_FORK == 'true')) }}
    runs-on: ubuntu-latest
    # Configure this environment in the repository settings:
    #   - required reviewer
    #   - TYPST_PACKAGES_TOKEN as an environment secret (fine-grained PAT with Contents:
    #     read/write on your typst/packages fork)
    #   - deployment tags restricted to v* (and main if you dispatch from main)
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pelermaid-package
          path: dist/packages

      - name: Push branch to packages fork
        env:
          TYPST_PACKAGES_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
          PACKAGES_FORK_OWNER: ${{ github.repository_owner }}
          PACKAGES_UPSTREAM: typst/packages
          PACKAGE_PATH: dist/packages/preview/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}
        run: ./scripts/push-packages-fork.sh "$PACKAGE_PATH"
